name: Docs

# Builds the MkDocs site (mkdocs.yml, site-docs/) with --strict and pushes it to
# the gh-pages branch. A broken link or a missing page fails here instead of
# shipping.
#
# The site's colours are not in the site: hooks/design_tokens.py reads them from
# web/app/globals.css at build time, which is why web/app/globals.css is in the
# path filter below.
#
# Deployment uses `mkdocs gh-deploy` rather than the Pages actions so that the
# only third-party action is the checkout this repository already pins. To
# publish, enable Pages for the repository with "Deploy from a branch", branch
# gh-pages, folder / (root).

on:
  push:
    branches: [master]
    paths:
      - mkdocs.yml
      - requirements-docs.txt
      - site-docs/**
      - docs-overrides/**
      - hooks/**
      - web/app/globals.css
      - .github/workflows/docs.yml
  workflow_dispatch:
  # A new demo (demo.yml) is published as soon as it is recorded.
  workflow_run:
    workflows: [Demo]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The static demo is built by demo.yml onto the demo-site branch. MkDocs
      # copies it as it copies any non-Markdown file, and the banner that links
      # to it is shown only when it is there (DEMO in mkdocs.yml).
      - name: Add the recorded demo
        run: |
          if git rev-parse --verify -q origin/demo-site > /dev/null; then
            mkdir -p site-docs/demo
            git archive origin/demo-site | tar -x -C site-docs/demo
            echo "DEMO=true" >> "$GITHUB_ENV"
          fi
      - name: Install MkDocs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ./requirements-docs.txt
      # gh-deploy commits to gh-pages. An empty email keeps an address out of
      # this file; git accepts it and records the author as `docs-bot <>`.
      #
      # SITE_URL is derived from the repository this runs in, so the address is
      # never written into a file and a fork gets its own. mkdocs.yml reads it;
      # without it the language switcher links point at the domain root and 404
      # on a project site. The Pages host is the owner name in lower case.
      - name: Build and push to gh-pages
        run: |
          git config user.name docs-bot
          git config user.email ""
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          export SITE_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          .venv/bin/mkdocs gh-deploy --strict --force --no-history
